<title>SnipArc Docs</title>
<style>
:root{
  --bg:#f7f8fa; --panel:#fff; --side:#eef1f5; --text:#1a1f2b; --muted:#66707f;
  --line:#dde2ea; --accent:#2f5fd0; --accent-soft:#e6edfb; --code-bg:#f0f2f6;
  --mark:#fde68a;
}
:root[data-theme=dark]{
  --bg:#11151c; --panel:#161b24; --side:#0e1218; --text:#e3e8ef; --muted:#8d97a6;
  --line:#232b37; --accent:#7aa2f7; --accent-soft:#1b2436; --code-bg:#0d1117;
  --mark:#7c5e12;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    --bg:#11151c; --panel:#161b24; --side:#0e1218; --text:#e3e8ef; --muted:#8d97a6;
    --line:#232b37; --accent:#7aa2f7; --accent-soft:#1b2436; --code-bg:#0d1117;
    --mark:#7c5e12;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--text); display:flex; height:100vh; overflow:hidden;
  font:15px/1.65 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
aside{
  width:280px; flex:none; background:var(--side); border-right:1px solid var(--line);
  display:flex; flex-direction:column; overflow:hidden;
}
.brand{padding:18px 18px 12px;border-bottom:1px solid var(--line)}
.brand h1{margin:0;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.brand p{margin:4px 0 0;font-size:18px;font-weight:650}
.tools{padding:12px 14px;display:flex;gap:8px;border-bottom:1px solid var(--line)}
#q{
  flex:1;min-width:0;padding:7px 10px;border:1px solid var(--line);border-radius:7px;
  background:var(--panel);color:var(--text);font-size:13px;
}
#q:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
#theme{
  flex:none;width:34px;border:1px solid var(--line);border-radius:7px;background:var(--panel);
  color:var(--muted);cursor:pointer;font-size:14px;
}
#theme:hover{color:var(--text);border-color:var(--accent)}
nav{overflow-y:auto;padding:10px 0 30px;flex:1}
nav h2{
  margin:16px 18px 6px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);font-weight:700;
}
nav a{
  display:block;padding:6px 18px;color:var(--text);text-decoration:none;font-size:13.5px;
  border-left:2px solid transparent;
}
nav a:hover{background:var(--accent-soft)}
nav a.on{border-left-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
nav a .hit{display:block;font-size:11px;color:var(--muted);font-weight:400}
nav a.hide{display:none}
main{flex:1;overflow-y:auto;padding:44px 52px 120px}
article{max-width:820px;margin:0 auto}
.note{
  max-width:820px;margin:0 auto;padding:20px 22px;border:1px solid var(--line);
  border-radius:10px;background:var(--panel);
}
.note h2{margin:0 0 10px;font-size:17px}
.note code{white-space:pre-wrap}
.note .why{color:var(--muted);font-size:13.5px;margin-bottom:0}
#snapbar{
  margin:auto 12px 12px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;
  background:var(--panel);color:var(--muted);font-size:11.5px;line-height:1.45;
}
h1,h2,h3,h4,h5,h6{line-height:1.3;margin:1.9em 0 .6em;font-weight:650}
h1{font-size:29px;margin-top:0;letter-spacing:-.01em}
h2{font-size:21px;padding-bottom:6px;border-bottom:1px solid var(--line)}
h3{font-size:17px}
h4,h5,h6{font-size:15px}
p,ul,ol{margin:0 0 1em}
ul,ol{padding-left:1.4em}
li{margin:.25em 0}
a{color:var(--accent)}
hr{border:0;border-top:1px solid var(--line);margin:2em 0}
blockquote{
  margin:1em 0;padding:.6em 1em;border-left:3px solid var(--accent);
  background:var(--accent-soft);border-radius:0 6px 6px 0;color:var(--muted);
}
blockquote p:last-child{margin:0}
code{
  font:13px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;
  background:var(--code-bg);padding:.15em .4em;border-radius:4px;
}
pre{
  background:var(--code-bg);border:1px solid var(--line);border-radius:8px;
  padding:14px 16px;overflow-x:auto;margin:0 0 1.2em;
}
pre code{background:none;padding:0;font-size:12.5px;line-height:1.35}
article img{max-width:100%;height:auto;display:block;margin:0 0 1.4em}
.tw{overflow-x:auto;margin:0 0 1.3em}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{border:1px solid var(--line);padding:7px 11px;text-align:left;vertical-align:top}
th{background:var(--code-bg);font-weight:650}
mark{background:var(--mark);color:inherit;border-radius:2px}
@media (max-width:820px){
  body{flex-direction:column}
  aside{width:100%;height:auto;max-height:44vh;border-right:0;border-bottom:1px solid var(--line)}
  main{padding:26px 20px 80px}
}
</style>

<aside>

<script>
// Manifest. Add an entry whenever a doc is added to this folder.
const DOCS = [
  {g:"Overview", f:"../CHANGELOG.md", t:"Changelog"},
  {g:"Overview", f:"README.md", t:"Documentation Index"},
  {g:"Overview", f:"architecture.md", t:"Architecture"},
  {g:"Overview", f:"requirements.md", t:"Product Requirements"},

  {g:"Documents", f:"code-signing.md", t:"Code signing policy"},
  {g:"Documents", f:"security-and-privacy.md", t:"Security and Privacy"},
  {g:"Documents", f:"testing.md", t:"Testing Strategy"},
];

/* ---------- markdown ---------- */
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function inline(s){
  // \ue000 is a private-use sentinel. It cannot occur in real documentation, and
  // unlike a NUL byte it keeps this file plain text as far as git is concerned.
  const code = [];
  s = s.replace(/`([^`]+)`/g, (m,c) => (code.push(c), '\ue000C'+(code.length-1)+'\ue000'));
  s = esc(s);
  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, '<img alt="$1" src="$2" style="max-width:100%">');
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2">$1</a>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  s = s.replace(/~~([^~]+)~~/g, '<del>$1</del>');
  return s.replace(/\ue000C(\d+)\ue000/g, (m,i) => '<code>'+esc(code[i])+'</code>');
}

function render(src){
  const L = src.replace(/\r/g,'').split('\n');
  const out = [];
  let i = 0;
  const blank = s => !s.trim();

  while(i < L.length){
    const line = L[i];

    if(blank(line)){ i++; continue; }

    // fenced code
    const fence = line.match(/^```(\w*)/);
    if(fence){
      const buf = [];
      i++;
      while(i < L.length && !/^```/.test(L[i])) buf.push(L[i++]);
      i++;
      out.push('<pre><code>'+esc(buf.join('\n'))+'</code></pre>');
      continue;
    }

    // heading
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if(h){ const n = h[1].length; out.push(`<h${n}>${inline(h[2])}</h${n}>`); i++; continue; }

    // hr
    if(/^\s*(---+|\*\*\*+|___+)\s*$/.test(line)){ out.push('<hr>'); i++; continue; }

    // table: header row followed by a separator row
    if(/^\s*\|/.test(line) && i+1 < L.length && /^\s*\|[\s:|-]+\|?\s*$/.test(L[i+1])){
      const cells = r => r.trim().replace(/^\||\|$/g,'').split('|').map(c => c.trim());
      const head = cells(line);
      i += 2;
      const rows = [];
      while(i < L.length && /^\s*\|/.test(L[i])) rows.push(cells(L[i++]));
      out.push(
        '<div class="tw"><table><thead><tr>' +
        head.map(c => '<th>'+inline(c)+'</th>').join('') +
        '</tr></thead><tbody>' +
        rows.map(r => '<tr>'+r.map(c => '<td>'+inline(c)+'</td>').join('')+'</tr>').join('') +
        '</tbody></table></div>'
      );
      continue;
    }

    // blockquote
    if(/^\s*>/.test(line)){
      const buf = [];
      while(i < L.length && /^\s*>/.test(L[i])) buf.push(L[i++].replace(/^\s*>\s?/,''));
      out.push('<blockquote>'+render(buf.join('\n'))+'</blockquote>');
      continue;
    }

    // list, two levels via indentation
    if(/^\s*([-*+]|\d+\.)\s+/.test(line)){
      const tag = /^\s*\d+\./.test(line) ? 'ol' : 'ul';
      let html = '<'+tag+'>';
      let depth = 0, openItem = false;
      while(i < L.length && /^\s*([-*+]|\d+\.)\s+/.test(L[i])){
        const m = L[i].match(/^(\s*)([-*+]|\d+\.)\s+(.*)$/);
        const d = m[1].length >= 2 ? 1 : 0;
        if(d > depth){                      // descend, parent <li> stays open
          html += '<ul>'; depth = d; openItem = false;
        }else if(d < depth){                // close nested list AND its parent <li>
          if(openItem) html += '</li>';
          html += '</ul></li>'; depth = d; openItem = false;
        }else if(openItem){ html += '</li>'; openItem = false; }
        html += '<li>' + inline(m[3]);
        openItem = true;
        i++;
        // continuation lines belonging to this item
        while(i < L.length && !blank(L[i]) && !/^\s*([-*+]|\d+\.)\s+/.test(L[i]) && !/^[#>`|]/.test(L[i])){
          html += ' ' + inline(L[i].trim());
          i++;
        }
      }
      if(depth > 0){                        // still nested at end of list
        if(openItem) html += '</li>';
        html += '</ul></li>'; openItem = false;
      }
      if(openItem) html += '</li>';
      out.push(html + '</'+tag+'>');
      continue;
    }

    // paragraph
    const buf = [];
    while(i < L.length && !blank(L[i]) && !/^\s*([-*+]|\d+\.)\s+/.test(L[i])
          && !/^(#{1,6}\s|```|\s*>|\s*\|)/.test(L[i]) && !/^\s*(---+|\*\*\*+)\s*$/.test(L[i])){
      buf.push(L[i++]);
    }
    if(buf.length) out.push('<p>'+inline(buf.join('\n'))+'</p>');
  }
  return out.join('\n');
}

/* ---------- app ---------- */
const nav = document.getElementById('nav');
const view = document.getElementById('view');
const q = document.getElementById('q');
const cache = {};
let links = [];

function buildNav(){
  let group = null;
  DOCS.forEach(d => {
    if(d.g !== group){
      group = d.g;
      const h = document.createElement('h2');
      h.textContent = group;
      nav.appendChild(h);
    }
    const a = document.createElement('a');
    a.href = '#' + d.f;
    a.textContent = d.t;
    a.dataset.file = d.f;
    nav.appendChild(a);
    links.push(a);
  });
}

// Each doc is embedded below so that double-clicking this file works: browsers
// block fetch() of local files, and there is no way around that from inside the
// page. The live file is still preferred whenever one is reachable, so a copy
// served over http is never stale, and the banner says when you are reading a
// snapshot instead.
const EMBEDDED = {"../CHANGELOG.md": "# Changelog\n\n## Unreleased\n\n### Added\n\n- User-stepped scrolling capture with tested vertical-overlap detection and PNG composition.\n- Selected-area animated GIF recording at 8 FPS for up to 15 seconds.\n- Offline English OCR plus local QR and multi-format barcode recognition.\n- Opt-in translation through a user-configured HTTPS LibreTranslate-compatible endpoint.\n- Optional translation API key, sent as `api_key` only when one is configured, for hosted\n  LibreTranslate services that reject unauthenticated requests.\n- `deploy/libretranslate/docker-compose.yml` for running a self-hosted translation backend.\n\n### Changed\n\n- Translation failures now explain the cause. A 401 or 403 states that the service needs an API\n  key, a 404 points at the missing `/translate` path, and the service's own error text is shown.\n- The settings window states the endpoint and API key rules inline instead of hiding them in a\n  tooltip.\n\n### Fixed\n\n- `SingleInstanceService` no longer writes its lock file to a hard-coded `%LOCALAPPDATA%` path.\n  The root is injectable, so tests stop leaving a directory behind on every run.\n- Manifest V3 Edge/Chrome extension for private visible-tab capture, crop, copy, and download.\n- WiX 5 per-machine x64 MSI and registry-backed Group Policy Administrative Templates.\n- Automated integration tests for OCR/barcode recognition, GIF frame timing, scrolling composition, and output encoding.\n- Repeatable release-script packaging for the Chromium extension, enterprise MSI, and per-user installer.\n- MIT licensing, contribution guidance, private security-reporting instructions, issue forms, and automated dependency update configuration for the public repository.\n\n### Fixed\n\n- Settings now survive application restarts and Windows sign-in. Earlier builds wrote a PascalCase JSON envelope while the loader accepted only camelCase, causing valid saved settings to be replaced in memory by defaults on each fresh process.\n\n### Changed\n\n- Advanced the working version to `0.2.0-alpha`.\n- Adopted **SnipArc** as the working public product name while retaining legacy internal identifiers for upgrade compatibility.\n- Replaced the generic crop-frame icon with an original crop-corners, cyan gesture-arc, and violet-spark mark.\n- Renamed the generated installer to `SnipArc-Setup-x64.exe`.\n- Selected the SignPath Foundation open-source program as the no-cost trusted-signing path; releases remain explicitly unsigned until the application is approved.\n- Replaced the custom-license GIF dependency with a first-party streaming\n  encoder built on the MIT-licensed WPF imaging stack, leaving only\n  OSI-approved non-system runtime dependencies.\n\n## 0.1.0-alpha — 2026-07-20\n\nFirst working Windows alpha.\n\n### Added\n\n- Notification-area app with global capture shortcut and single-instance activation.\n- Optional setting that routes Windows + Shift + S to SnipArc instead of the built-in Snipping Tool while SnipArc is running.\n- Active-monitor screen capture, selection movement/resizing, live dimensions, and keyboard nudging.\n- Automatic visible-window detection with hover highlighting and click-to-select whole-window capture.\n- Pen, line, arrow, rectangle, highlighter, text, pixelation, and opaque-redaction tools.\n- Compact dark overlay controls with vector icons and directional resize cursors.\n- Original application icon embedded in the EXE, installer, shortcuts, and notification area.\n- Undo/redo, clipboard copy, quick save, and PNG/JPG/BMP export.\n- Settings for shortcut, output folder, file format, pointer inclusion, notifications, and Windows startup.\n- Self-contained per-user Inno Setup installer.\n- Automated geometry, editor, Windows-service, and redaction export tests.\n\n### Security and privacy\n\n- No upload implementation, account requirement, telemetry, or screenshot history.\n- Opaque redactions replace covered output pixels exactly and are applied after every other annotation.\n- Captures containing opaque redactions can only be saved in lossless PNG or BMP format.\n\n### Known limitations\n\n- One monitor per capture session; cross-monitor selection remains planned.\n- Unsigned development build.\n- Full mixed-DPI, HDR, protected-content, and exclusive-fullscreen validation remains pending.\n", "README.md": "# Documentation Index\n\nThis directory separates product, technical, security, and verification concerns.\n\nImplementation status: `0.2.0-alpha` is working with local screenshot capture, scrolling composition, GIF recording, recognition, a source-loadable browser extension, and buildable enterprise packaging. Documents describe the longer-term 1.0 target unless a section is explicitly labeled as current-alpha behavior.\n\nOpen `index.html` to browse these documents in a browser. Double-click `serve.cmd` first; browsers block a page from reading sibling files over `file://`.\n\n## Document map\n\n| Document | Primary audience | Owns |\n|---|---|---|\n| [Product requirements](requirements.md) | Product owner, developer, tester | User workflows, feature scope, numbered requirements, acceptance criteria |\n| [Architecture](architecture.md) | Developer, reviewer | Components, data flow, coordinate invariants, interfaces, persistence, failure handling |\n| [Security and privacy](security-and-privacy.md) | Developer, security reviewer | Data classification, trust boundaries, threats, required controls, logging restrictions |\n| [Testing strategy](testing.md) | Developer, tester, release owner | Test layers, hardware matrix, performance measurement, release evidence |\n| [Code signing](code-signing.md) | User, release owner | Current signature state and the SignPath Foundation integration plan |\n| [Translation backend](../deploy/libretranslate/README.md) | User, IT administrator | Self-hosting the optional LibreTranslate service SnipArc talks to |\n| [Browser extension](../extensions/chromium/README.md) | Developer, tester | Edge/Chrome development installation and browser limitations |\n| [Enterprise deployment](../packaging/enterprise/README.md) | IT administrator, release owner | MSI build, silent deployment, and Group Policy installation |\n| [Contributing](../CONTRIBUTING.md) | Contributor | Development setup, change expectations, and pull request validation |\n| [Security policy](../SECURITY.md) | Reporter, maintainer | Private vulnerability reporting and supported versions |\n| [MIT License](../LICENSE) | User, contributor | Rights and conditions for SnipArc source and distributions |\n\n## Authority and change rules\n\n- Product behavior is authoritative in `requirements.md`.\n- Technical structure and invariants are authoritative in `architecture.md`.\n- Security and privacy controls are authoritative in `security-and-privacy.md`.\n- Verification requirements are authoritative in `testing.md`.\n- A conflict between documents is a defect. Update all affected documents in the same change.\n- New features default to post-1.0 scope unless they are required to satisfy an existing P0 acceptance criterion.\n\n## Status labels\n\n- `Accepted` - implementation should follow the decision.\n- `Proposed` - recommended but still reversible before implementation.\n- `Open` - product-owner input is required.\n- `Deferred` - intentionally excluded from the current release.\n- `Superseded` - retained for history and linked to its replacement.\n\n## Documentation quality checklist\n\nBefore merging a documentation change:\n\n- Check internal links and heading anchors.\n- Keep requirement IDs stable once implementation references them.\n- Give every P0 requirement an objective acceptance criterion.\n- Label facts, inferences, recommendations, and open decisions clearly.\n- Do not describe unsupported Windows behavior as guaranteed.\n- Do not place secrets, private upload URLs, or captured image content in examples.\n- Update the “last reviewed” date in any materially changed document.\n- Add the document's entry to `index.html` in the same change.\n", "architecture.md": "# Architecture\n\nStatus: Proposed implementation architecture\nLast reviewed: 2026-07-22\n\n## 1. Architecture goals\n\n- Keep the hotkey-to-overlay path short and deterministic.\n- Keep capture, editing, and local outputs independent of network availability.\n- Represent geometry in physical desktop pixels to avoid mixed-DPI drift.\n- Keep source pixels immutable and annotations non-destructive until export.\n- Isolate Win32 resources behind narrow, testable interfaces.\n- Allow the capture backend and upload providers to change without rewriting the editor.\n- Package every required runtime dependency inside one downloadable installer.\n\n## 2. Technology baseline\n\n| Concern | Selection | Reason |\n|---|---|---|\n| Language/runtime | C# 14 and .NET 10 LTS | Current supported Windows desktop runtime through November 2028 |\n| UI | WPF | Mature Windows desktop UI, custom borderless overlays, vector rendering, native message integration |\n| Process model | One per-user tray process | Global hotkey ownership and fast capture activation |\n| Capture v1 | GDI BitBlt with `SRCCOPY | CAPTUREBLT` | Immediate virtual-desktop snapshot without the Windows system picker |\n| DPI model | Per-Monitor V2 | Physical-pixel accuracy on mixed-scale displays |\n| Encoding | WPF/Windows bitmap codecs | PNG/JPEG/BMP support without an image-library dependency |\n| Installer | Inno Setup | Single Setup EXE, per-user install, upgrade/uninstall, silent switches |\n| Configuration | Versioned JSON under LocalAppData | Human-inspectable, easy migration, no database dependency |\n| Secret storage | Credential Manager or DPAPI | Avoid plaintext upload credentials and deletion tokens |\n\n## 3. Solution boundaries\n\n```text\nsrc/\n  AppName.App/          WPF startup, tray, overlay/settings windows\n  AppName.Core/         Selection, annotations, commands, interfaces\n  AppName.Windows/      Capture, DPI, hotkeys, clipboard, credentials\n  AppName.Upload/       Optional upload-provider implementations\n\ntests/\n  AppName.Core.Tests/\n  AppName.Windows.Tests/\n  AppName.IntegrationTests/\n```\n\nDependency direction:\n\n```text\nAppName.App ---------> AppName.Core\n     |                      ^\n     +--> AppName.Windows --+\n     |\n     +--> AppName.Upload ---+\n\nAppName.Core has no dependency on WPF windows, HTTP clients, registry,\nclipboard, installer, or a concrete screen-capture API.\n```\n\n## 4. Runtime components\n\n```text\nAppHost\n  |\n  +-- SingleInstanceService\n  +-- TrayService\n  +-- HotkeyService\n  +-- SettingsService\n  +-- CaptureCoordinator\n          |\n          +-- DisplayTopologyService\n          +-- IScreenCaptureBackend\n          +-- OverlayManager\n          +-- CaptureDocument\n          |      +-- Selection\n          |      +-- Annotation collection\n          |      +-- Undo/redo command stack\n          +-- ImageCompositor\n          +-- OutputCoordinator\n                 +-- ClipboardService\n                 +-- FileOutputService\n                 +-- IUploadProvider\n```\n\n### AppHost\n\nOwns process startup and shutdown. It is responsible for establishing the single-instance boundary before initializing hotkeys or the tray icon.\n\n### CaptureCoordinator\n\nOwns one capture session at a time. It freezes display topology, captures source pixels, creates overlays, owns session cancellation, and transfers the final document to output services.\n\n### CaptureDocument\n\nContains all state required to reproduce output:\n\n- Immutable captured source bitmap(s).\n- Physical-pixel selection rectangle.\n- Ordered immutable annotation records.\n- Current editor/tool settings.\n- Undo/redo command history.\n\nThe document does not contain a provider credential, output path, WPF control, HWND, HDC, or HTTP client.\n\n### ImageCompositor\n\nProduces the authoritative output bitmap. Clipboard, save, and upload must all use this component. The overlay preview may use optimized WPF rendering, but it cannot be the source of saved pixels.\n\n## 5. Capture sequence\n\n```text\nUser       Hotkey      Coordinator      Capture backend      Overlay\n |            |             |                  |                 |\n |--press---->|             |                  |                 |\n |            |--activate-->|                  |                 |\n |            |             |--read topology-->|                 |\n |            |             |--snapshot------->|                 |\n |            |             |<--source pixels--|                 |\n |            |             |--create overlays----------------->|\n |<-----------------------------interactive selection/editor----|\n |--copy/save/upload-------------------------------------------->|\n |            |             |<--final document------------------|\n |            |             |--composite/export                  |\n```\n\nRequired ordering invariant: no overlay HWND may become visible until the desktop snapshot is complete.\n\n## 6. Coordinate system\n\nCoordinate mistakes are the largest technical risk. The domain model uses one coordinate space:\n\n> Signed physical pixels relative to the virtual-desktop origin.\n\nThis permits monitors to exist left of or above the primary display. WPF device-independent units are used only at the UI boundary.\n\n### Required invariants\n\n- Monitor bounds, source bitmaps, selection bounds, and annotation geometry are normalized to physical pixels.\n- Conversion between WPF units and physical pixels occurs in one adapter, not throughout editor code.\n- Every overlay knows its monitor's physical origin, DPI, and clipping bounds.\n- A cross-monitor selection remains one document rectangle; each overlay displays only its clipped portion.\n- Output dimensions equal the normalized selection width and height exactly.\n- Display topology is immutable during one capture session. A topology change cancels the session safely.\n\n## 7. Capture backend\n\n```csharp\npublic interface IScreenCaptureBackend\n{\n    CaptureSession CaptureVirtualDesktop(\n        DisplayTopology topology,\n        bool includeCursor);\n}\n```\n\n### GDI implementation\n\n- Read virtual-screen bounds through Win32 display APIs.\n- Copy with BitBlt using `SRCCOPY | CAPTUREBLT`.\n- Wrap HDC, HBITMAP, HICON, and related resources in deterministic safe handles.\n- Use `GetCursorInfo` and `GetIconInfo` when cursor capture is enabled.\n- Apply the cursor hotspot and signed virtual-screen coordinates correctly.\n- Snapshot before creating overlays.\n\n### Known limitations\n\nGDI may not correctly capture every HDR, protected, or exclusive-fullscreen surface. Do not add ad hoc hooks to work around individual applications. If beta evidence justifies another backend, implement DXGI Desktop Duplication behind the existing interface and rerun the complete display matrix.\n\n`Windows.Graphics.Capture` remains an option for future user-selected window/display modes, but its standard secure picker does not match the one-hotkey region workflow.\n\n## 8. Overlay and editor model\n\nUse one topmost borderless overlay per monitor with one shared `CaptureDocument`.\n\nOverlay responsibilities:\n\n- Draw frozen source pixels and dimming outside the selection.\n- Preview the topmost eligible window from the pre-overlay z-order snapshot and convert a click into its physical-pixel bounds.\n- Convert pointer input at the UI boundary.\n- Display selection handles, dimensions, tools, and keyboard focus.\n- Clip shared selection/annotation preview to the overlay monitor.\n- Reposition toolbars within the monitor work area.\n\nThe window detector enumerates visible top-level windows before the overlay exists. It preserves `EnumWindows` z-order, uses DWM extended-frame bounds when available, and excludes the shell, minimized, cloaked, tool, untitled, zero-sized, and current-process windows. The active-monitor alpha only offers candidates fully contained by that monitor; dragging beyond the click threshold always switches to manual region selection.\n\nCore responsibilities:\n\n- Normalize, move, resize, and clamp selection geometry.\n- Store immutable annotation records.\n- Execute editor commands and undo/redo.\n- Define annotation scaling semantics.\n\nRecommended rule: once the first annotation is committed, lock source selection bounds. This avoids ambiguous scaling and cropping of existing annotations.\n\n## 9. Annotation records\n\nRecommended discriminated record types:\n\n- `FreehandPathAnnotation`\n- `LineAnnotation`\n- `ArrowAnnotation`\n- `RectangleAnnotation`\n- `HighlightAnnotation`\n- `TextAnnotation`\n- `PixelateAnnotation`\n- `OpaqueRedactionAnnotation`\n\nPixelation and redaction are not synonyms:\n\n- Pixelation is an irreversible visual transform but can leave content inferable.\n- Opaque redaction replaces all covered final pixels with a fully opaque color.\n\nThe compositor must flatten both into exported pixels and omit editor-layer metadata from saved images.\n\n## 10. Output architecture\n\n```text\nCaptureDocument\n      |\nImageCompositor\n      |\n      +-- Bitmap -> ClipboardService\n      +-- Bitmap -> Encoder -> Atomic file write\n      +-- Bitmap -> Encoder -> IUploadProvider\n```\n\n### Clipboard\n\n- Use the STA UI thread or a dedicated STA service.\n- Retry temporary clipboard contention with a short bounded backoff.\n- Keep the capture session open if copy fails.\n\n### Files\n\n- Encode to a temporary file in the destination directory and atomically replace/move when complete.\n- Never silently overwrite an existing file.\n- Treat unavailable OneDrive, network, or removable destinations as recoverable errors.\n- Do not use a global temp directory for screenshot pixels.\n\n### Upload contract\n\n```csharp\npublic interface IUploadProvider\n{\n    Task<UploadResult> UploadAsync(\n        Stream image,\n        UploadMetadata metadata,\n        IProgress<double> progress,\n        CancellationToken cancellationToken);\n}\n\npublic sealed record UploadResult(\n    Uri ViewUrl,\n    string? DeleteToken,\n    DateTimeOffset? ExpiresAt);\n```\n\nProviders cannot depend on overlay types or mutate the capture document. Security rules are defined in [Security and privacy](security-and-privacy.md).\n\n## 11. Process lifecycle and IPC\n\n- Scope the mutex and activation IPC to the current user and interactive session.\n- Include the current user SID in object names.\n- Apply restrictive ACLs.\n- Validate activation message type and size.\n- A second process sends only an activation command, then exits.\n- No image pixels, file paths, URLs, credentials, or arbitrary command lines cross the activation channel.\n\n## 12. Settings and migrations\n\nSettings path:\n\n```text\n%LocalAppData%\\<Publisher>\\<AppName>\\settings.json\n```\n\nSettings document requirements:\n\n- Explicit schema version.\n- Safe defaults for every field.\n- Validation before applying hotkeys, paths, or upload settings.\n- Atomic write through a sibling temporary file.\n- Backup/recovery from malformed JSON.\n- Forward migration one supported version at a time.\n- No credentials or deletion tokens.\n\nThe canonical envelope uses camelCase (`schemaVersion` and `settings`). The loader compares envelope names case-insensitively so PascalCase files written by early alpha builds remain readable. This backward-compatibility rule is regression-tested because rejecting the older casing makes every fresh process appear to reset user preferences.\n\nSnipArc is the public display name. The following internal identifiers remain stable through the alpha upgrade path: `%LocalAppData%\\ScreenCaptureApp`, `ScreenCaptureApp.exe`, the `ScreenCaptureApp` HKCU Run value, the single-instance identifier, and the Inno Setup AppId. Changing these identifiers requires an explicit settings/install migration rather than a search-and-replace rename.\n\nStartup preference uses one quoted HKCU Run value owned by the app. The installer removes that known value on uninstall but does not create a competing startup mechanism.\n\n## 13. Packaging\n\nPublish `win-x64` as a self-contained folder. Inno Setup packages the complete folder into one downloadable `Setup.exe` and installs it per user under:\n\n```text\n%LocalAppData%\\Programs\\<AppName>\n```\n\nSingle-file .NET publishing is optional. It should be enabled only if native dependency, extraction, antivirus, and cold-start tests show no regression. The user-facing requirement is one installer EXE, not one physical file inside the installation directory.\n\nThe consumer package remains the per-user Inno Setup EXE. Managed environments can build the separate WiX 5 per-machine MSI under `packaging/enterprise`; the MSI harvests the exact self-contained publish directory and is paired with ADMX/ADML policy definitions. Neither distribution is trusted for public use until its complete payload is signed and validated.\n\n## 14. Failure-handling rules\n\n| Failure | Required behavior |\n|---|---|\n| Hotkey conflict | Explain and allow fallback; do not silently change Windows settings |\n| Optional Windows + Shift + S override | A low-level keyboard hook suppresses only the S key event for that exact chord, dispatches capture asynchronously, and is removed immediately when disabled or on shutdown |\n| Capture resource failure | Release acquired handles, close overlays, show actionable error |\n| Display topology changes | Cancel current session and invite a retry |\n| Clipboard locked | Bounded retry; keep document open on final failure |\n| Save path unavailable | Preserve document and allow another destination |\n| Upload canceled/timed out | Preserve document and allow retry/copy/save |\n| Settings corrupt | Quarantine invalid file, use safe defaults, notify once |\n| Second instance | Activate first process and exit |\n\n## 15. Architecture fitness checks\n\n- `AppName.Core` builds without WPF/Win32/HTTP references.\n- Core geometry and editor commands are deterministic unit tests.\n- Clipboard, capture, DPI, and upload implementations can be substituted with fakes.\n- No output path bypasses `ImageCompositor`.\n- No network dependency appears on the capture-to-local-save path.\n- GDI/User handle soak tests show zero net growth.\n- The exact install payload runs in a fresh Windows VM with no separate .NET installation.\n\n## 16. Expansion components\n\n| Component | Boundary | Data behavior |\n|---|---|---|\n| `VerticalFrameStitcher` | Platform-neutral BGRA32 frame composition in Core | Finds sampled vertical overlap and returns one in-memory image; no I/O or network |\n| `ScrollingCaptureService` | Windows capture plus PNG output | Captures only the fixed viewport chosen by the user; writes only on Finish |\n| `GifRecordingService` | Windows capture plus animated GIF encoding | Streams frames into a temporary encoder file, publishes atomically, and limits recording to 15 seconds and 1280 pixels |\n| `ImageRecognitionService` | Local Tesseract and ZXing adapters | OCR and barcode pixels remain in process; output text is not logged or persisted |\n| `TranslationService` | Optional HTTP boundary | Sends extracted text only after a user action and only to the configured endpoint; attaches `api_key` only when the user configures one |\n| Chromium extension | Browser process, independent of desktop IPC | Stores a pending PNG in extension session storage and supports local crop/copy/download |\n| Enterprise policy provider | Read-only HKLM/HKCU policy boundary | Machine policy wins over user policy; managed values override JSON preferences at runtime |\n\nCloud/community features are not folded into the tray process. If built, they require a separately deployed service, explicit authentication and upload interfaces, their own data-retention controls, and independent security review. Native macOS/Linux clients likewise share only platform-neutral models and protocols; they do not attempt to reuse WPF or Win32 capture code.\n\n## References\n\n- [.NET support policy](https://dotnet.microsoft.com/en-us/platform/support/policy)\n- [WPF documentation](https://learn.microsoft.com/en-us/dotnet/desktop/wpf/)\n- [High-DPI desktop development](https://learn.microsoft.com/en-us/windows/win32/hidpi/high-dpi-desktop-application-development-on-windows)\n- [RegisterHotKey](https://learn.microsoft.com/en-us/windows/win32/api/winuser/nf-winuser-registerhotkey)\n- [Windows screen capture](https://learn.microsoft.com/en-us/windows/apps/develop/media-authoring-processing/screen-capture)\n- [Microsoft Edge native/browser extension architecture](https://learn.microsoft.com/en-us/microsoft-edge/extensions-chromium/)\n- [Registry-backed administrative policy](https://learn.microsoft.com/en-us/windows/client-management/understanding-admx-backed-policies)\n- [WiX file harvesting](https://docs.firegiant.com/wix/schema/wxs/files/)\n- [Inno Setup](https://jrsoftware.org/isinfo.php)\n", "requirements.md": "# Product Requirements\n\nStatus: Proposed for version 1.0\nLast reviewed: 2026-07-22\nProduct name: SnipArc\n\n## 1. Purpose\n\nSnipArc is a lightweight Windows utility for capturing a screen region, annotating it in place, and immediately copying, saving, or explicitly uploading it. It prioritizes a fast workflow, privacy, mixed-DPI reliability, predictable output, and secure redaction.\n\n## 2. Product principles\n\n1. **Fast path first** - capture to clipboard should require no unnecessary dialogs.\n2. **Local by default** - capture, edit, copy, and save do not require an account or network.\n3. **Explicit sharing** - no screenshot leaves the computer without a direct upload action.\n4. **Predictable output** - preview, clipboard, saved file, and uploaded image use the same compositor.\n5. **Windows-native behavior** - tray lifecycle, hotkeys, clipboard, DPI, installer, and uninstall follow Windows conventions.\n6. **Capability isolation** - recording, recognition, browser, enterprise, and future cloud features must not weaken the fast local capture path.\n\n## 3. Target users\n\n### Primary user\n\nA Windows user who frequently needs to show a small region of their screen in email, chat, documentation, support tickets, or issue reports. They value speed and basic markup more than a full image editor.\n\n### Secondary user\n\nA technical or business user who may capture sensitive information and needs a reliable local workflow, explicit uploads, opaque redaction, and predictable storage behavior.\n\n### Not a primary target for 1.0\n\n- Video creators needing long-form, high-frame-rate, or audio recording.\n- Designers needing layered image editing.\n- Cross-platform users.\n\n## 4. Primary workflows\n\n### Flow A - Capture and copy\n\n1. User presses the configured global hotkey.\n2. The desktop snapshot is frozen and dimmed.\n3. User drags a rectangular region and optionally refines it.\n4. User optionally annotates the selection.\n5. User presses Ctrl+C or selects Copy.\n6. The composited bitmap is placed on the clipboard and the overlay closes.\n\nSuccess means the image pastes correctly into common Windows applications without creating a file or making a network request.\n\n### Flow B - Capture and save\n\n1. User completes a selection and optional annotations.\n2. User chooses Save As or presses the quick-save shortcut.\n3. The image is encoded in the selected format.\n4. On success, the overlay closes and unobtrusive confirmation is shown.\n\nSuccess means a collision-safe file is created at the requested location and no prior file is silently overwritten.\n\n### Flow C - Capture and upload\n\n1. User completes a selection and optional annotations.\n2. User explicitly chooses Upload.\n3. The app displays provider/progress information and supports cancel.\n4. Provider returns a view URL and optional deletion token/expiration.\n5. The view URL is copied to the clipboard.\n\nSuccess means the user knows that the image left the computer, can identify the provider, and can delete it when the provider supports deletion.\n\n### Flow D - Hotkey conflict\n\n1. The app cannot register the requested global hotkey.\n2. The app remains running and explains that another app or Windows owns the shortcut.\n3. The user chooses a fallback shortcut in Settings.\n\nThe app must not silently alter Windows Snipping Tool, OneDrive, keyboard utility, or accessibility settings.\n\n## 5. Functional requirements\n\nPriority definitions:\n\n- P0 - required for version 1.0.\n- P1 - next release after the core is stable.\n- P2 - deferred with no version commitment.\n\n### Application lifecycle\n\n| ID | Priority | Requirement | Acceptance criterion |\n|---|---:|---|---|\n| FR-001 | P0 | Run as a single-instance tray application | A second launch activates the existing process; only one tray icon and hotkey registration exist |\n| FR-002 | P0 | Expose Capture, Recent Folder, Settings, About, and Exit from the tray menu | Each command works without a permanent main/taskbar window |\n| FR-003 | P0 | Shut down cleanly | Exit unregisters hotkeys, closes overlays, releases native handles, and removes the tray icon |\n| FR-004 | P0 | Optionally start at user sign-in | One quoted HKCU Run value is created/removed by the app; stale paths are repaired |\n\n### Hotkeys and capture activation\n\n| ID | Priority | Requirement | Acceptance criterion |\n|---|---:|---|---|\n| FR-010 | P0 | Provide a configurable global region-capture hotkey | The shortcut works while the app is unfocused and in the tray |\n| FR-011 | P0 | Default to Print Screen when Windows allows registration | Successful registration opens exactly one capture session |\n| FR-012 | P0 | Detect registration conflicts | Failure produces an actionable notice and Settings link; the app remains usable from the tray |\n| FR-012A | P0 | Optionally override the Windows + Shift + S Snipping Tool shortcut | Enabling the clearly labeled setting routes only that shortcut to this app while it is running; disabling or exiting immediately restores normal Windows behavior |\n| FR-013 | P1 | Add active-window and full-monitor capture shortcuts | Each mode produces exact target bounds without first opening region selection |\n| FR-014 | P1 | Add delayed capture | User can select a delay and cancel before the snapshot is taken |\n\n### Display capture and selection\n\n| ID | Priority | Requirement | Acceptance criterion |\n|---|---:|---|---|\n| FR-020 | P0 | Snapshot the desktop before showing overlays | No overlay, cursor crosshair, or toolbar pixel appears in output |\n| FR-021 | P0 | Support multiple displays and negative virtual coordinates | Required display matrix passes with exact output dimensions |\n| FR-022 | P0 | Support mixed 100%-200% scaling using physical-pixel bounds | Selection edges map to the intended source pixels on every tested monitor |\n| FR-023 | P0 | Create a click-drag rectangular selection | Dragging in any direction normalizes to a valid rectangle |\n| FR-023A | P0 | Detect eligible application windows under the pointer | The topmost visible, titled, non-minimized, non-cloaked application window is highlighted; one click selects its exact frame bounds while dragging still creates a region |\n| FR-024 | P0 | Show live width and height | Values equal final physical-pixel output dimensions |\n| FR-025 | P0 | Move and resize the selection | Edge/corner handles and drag movement remain within the virtual desktop |\n| FR-026 | P0 | Support keyboard refinement | Arrow keys nudge by one pixel; documented modifiers adjust the increment |\n| FR-027 | P0 | Support fullscreen select and cancel | Ctrl+A selects the active monitor; Esc cancels without changing clipboard/files |\n| FR-028 | P0 | Optionally include the visible cursor | Cursor position, hotspot, and monitor origin are correct |\n| FR-029 | P0 | Prevent concurrent capture sessions | Repeated hotkey presses do not create overlapping overlays or corrupt state |\n\n### Annotation\n\n| ID | Priority | Requirement | Acceptance criterion |\n|---|---:|---|---|\n| FR-030 | P0 | Draw freehand pen strokes | Preview and exported path meet documented golden-image tolerance |\n| FR-031 | P0 | Draw lines, arrows, and rectangles | Geometry and selected color/width are preserved in export |\n| FR-032 | P0 | Highlight with a translucent marker | Composited output matches preview within the documented color tolerance |\n| FR-033 | P0 | Add text | Text can be entered, committed, moved before commit, and exported at the correct scale |\n| FR-034 | P0 | Pixelate an area | Output contains flattened pixel blocks; UI labels it as obfuscation, not secure redaction |\n| FR-035 | P0 | Opaque-redact an area | Every decoded output pixel in the covered region is replaced with the opaque chosen color |\n| FR-036 | P0 | Select annotation color and width | New annotations use the selected values; behavior for existing annotations is documented |\n| FR-037 | P0 | Undo and redo editor actions | Command sequence is deterministic and fully restores the prior model state |\n| FR-038 | P0 | Keep toolbars visible | Toolbars reposition within the monitor work area near desktop edges |\n| FR-039 | P1 | Add numbered step markers and saved tool defaults | Defaults survive restart and exported numbering remains ordered |\n\n### Clipboard and local files\n\n| ID | Priority | Requirement | Acceptance criterion |\n|---|---:|---|---|\n| FR-040 | P0 | Copy the composited selection to the Windows clipboard | Bitmap pastes into Paint, Outlook, Teams, Office, browsers, Slack, and Discord test targets |\n| FR-041 | P0 | Retry temporary clipboard contention | Bounded retry succeeds when the lock clears; failure keeps the capture open |\n| FR-042 | P0 | Save PNG, JPG, and BMP | Decoded dimensions and expected format match the selected output |\n| FR-043 | P0 | Support Save As and collision-safe quick-save | Existing files are never overwritten without explicit confirmation |\n| FR-044 | P0 | Support configurable folder, filename pattern, format, and JPEG quality | Valid settings persist; invalid paths/patterns produce useful validation |\n| FR-045 | P0 | Open the last successful output folder | Missing or unavailable folders fail gracefully |\n| FR-046 | P1 | Print or open in an external editor | Command receives the same composited pixels as local save |\n\n### Uploading\n\n| ID | Priority | Requirement | Acceptance criterion |\n|---|---:|---|---|\n| FR-050 | P0* | Upload through an `IUploadProvider` implementation | Explicit action reports progress, supports cancel, and returns a view URL |\n| FR-051 | P0* | Copy the successful view URL | Clipboard contains the URL only after provider success |\n| FR-052 | P0* | Explain upload visibility and retention on first use | User sees provider, audience model, and expiration policy before first upload |\n| FR-053 | P0* | Preserve local recovery on upload failure | User can retry, copy, or save after timeout, cancel, or server failure |\n| FR-054 | P1 | Keep metadata-only recent upload history | History contains no image pixels and stores deletion tokens securely |\n\n`P0*` means required only when upload is included in the selected version 1.0 distribution profile. A local-only 1.0 may hide upload controls without failing release scope.\n\n### Settings and installation\n\n| ID | Priority | Requirement | Acceptance criterion |\n|---|---:|---|---|\n| FR-060 | P0 | Persist schema-versioned per-user settings | Values survive restart and upgrade; corrupt data recovers to safe defaults |\n| FR-061 | P0 | Install from one downloadable Setup EXE | Standard user installs without separately installing .NET or approving elevation |\n| FR-062 | P0 | Upgrade in place | Prior supported version upgrades without duplicate entries and preserves settings |\n| FR-063 | P0 | Uninstall cleanly | No process, binary, shortcut, Programs & Features entry, or startup value remains |\n| FR-064 | P0 | Support silent install/uninstall switches | Documented commands work in a clean Windows VM |\n\n### Extended capture and recognition\n\n| ID | Priority | Requirement | Acceptance criterion |\n|---|---:|---|---|\n| FR-070 | P1 | Build a scrolling capture from repeated views of one selected viewport | User captures pages manually; matching vertical overlap is removed; output is a decodable PNG |\n| FR-071 | P1 | Record a selected area as an animated GIF | Output contains multiple timed frames, loops, excludes the recording controls, and stops at the documented duration and dimension limits |\n| FR-072 | P1 | Extract English text locally | OCR runs with no network access and makes editable/copyable text available without retaining image pixels |\n| FR-073 | P1 | Recognize common 1D/2D barcodes locally | QR, Data Matrix, Aztec, PDF417, UPC/EAN, Code 39/93/128, ITF, Codabar, MSI, and RSS formats are attempted locally |\n| FR-074 | P1 | Translate extracted text through an optional provider | No request occurs until Translate is pressed; endpoint validation requires HTTPS except loopback; image pixels are never submitted |\n| FR-075 | P2 | Authenticate to translation providers that require it | An optional API key is sent as `api_key` only when configured; a 401 or 403 tells the user a key is needed rather than showing a bare status code |\n\n### Browser and managed distribution\n\n| ID | Priority | Requirement | Acceptance criterion |\n|---|---:|---|---|\n| FR-080 | P1 | Provide a Chromium browser extension | Edge/Chrome extension captures the visible tab, crops, copies, and downloads locally with no server dependency |\n| FR-081 | P1 | Provide a per-machine enterprise MSI | WiX build produces an x64 MSI supporting quiet install/uninstall and major upgrades |\n| FR-082 | P1 | Provide Group Policy settings | ADMX/ADML controls translation, capture folder, and startup; machine policy overrides user policy and JSON preferences |\n\n## 6. Nonfunctional requirements\n\n| ID | Category | Requirement |\n|---|---|---|\n| NFR-001 | Performance | Hotkey-to-overlay p95 <= 300 ms on one 4K display and <= 500 ms on three mixed-DPI displays |\n| NFR-002 | Performance | Idle CPU <= 0.1% average over five minutes on the reference machine |\n| NFR-003 | Performance | Idle working set target <= 100 MB on the reference machine |\n| NFR-004 | Performance | Normal annotation preview responds within one 60 Hz frame under the reference workload |\n| NFR-005 | Reliability | Net GDI/User handle growth is zero across the final 20 captures of a 100-capture soak test |\n| NFR-006 | Privacy | No outbound request occurs during capture, edit, recognition, copy, save, scrolling capture, or recording; translation and future upload/update actions are separately explicit |\n| NFR-007 | Privacy | No screenshot pixels are written to disk unless the user saves, enables thumbnail history, or uploads |\n| NFR-008 | Security | Credentials and deletion tokens are protected by Credential Manager or DPAPI and excluded from logs |\n| NFR-009 | Accessibility | Settings supports keyboard navigation, visible focus, Narrator naming, high contrast, and 200% text scaling |\n| NFR-010 | Compatibility | Version 1.0 supports documented Windows 11 x64 releases; unsupported systems receive a readable installer message |\n| NFR-011 | Offline | Capture, annotation, clipboard, settings, and local saving remain usable with no network |\n| NFR-012 | Maintainability | Capture, compositor, and upload providers are behind interfaces testable without production services |\n\n## 7. Expansion status\n\n| Capability | Status in 0.2 alpha | Remaining release dependency |\n|---|---|---|\n| Scrolling capture | Implemented as a user-stepped, overlap-stitched PNG workflow | Hardware/application matrix and improved handling of dynamic or repeating content |\n| Animated recording | Implemented for looping GIF, 8 FPS, 15-second maximum, no audio | Performance and visual validation across the supported display matrix |\n| OCR, translation, and barcode recognition | Implemented; OCR/barcodes are local and translation is provider-configured | Additional OCR language packs and provider compatibility testing |\n| Browser extension | Functional Manifest V3 Edge/Chrome source package | Store accounts, review, final extension IDs, and signed store publication |\n| Enterprise MSI/GPO | Buildable WiX 5 MSI and functional registry-backed ADMX policies | Authenticode certificate and clean-VM/managed-deployment validation |\n| Cloud accounts, galleries, comments, and social login | Not implemented | Hosting/operator, retention policy, abuse moderation, identity providers, legal documents, and service budget |\n| Native macOS and Linux clients | Not implemented | Separate UI/capture backends, signing/notarization, packaging, and test hardware |\n| Silent background installation of updates | Not enabled | Public immutable release feed plus signed metadata, signed installers, pinned signer identity, and rollback testing |\n\n## 8. Version 1.0 definition of done\n\nVersion 1.0 is complete when all applicable P0 requirements have evidence in the [testing strategy](testing.md), no P0 defects remain open, the exact signed installer hash passes release testing, and privacy inspection finds no unintended image persistence or network traffic.\n", "code-signing.md": "# Code signing policy\n\n## Current status\n\nSnipArc's `0.2.0-alpha` artifacts are unsigned. They are published with\nSHA-256 checksums for testing, but they must not be represented as trusted\nproduction releases.\n\n## Accepted signing path\n\nThe project will apply to the SignPath Foundation open-source program. SignPath\nFoundation provides qualifying open-source projects with trusted Authenticode\nsignatures at no charge and keeps the private signing key in managed signing\ninfrastructure.\n\n**Free code signing provided by\n[SignPath.io](https://about.signpath.io/), certificate by\n[SignPath Foundation](https://signpath.org/).**\n\nThe resulting Windows publisher identity will be **SignPath Foundation**, not\n`77degrees`. The repository remains the authoritative link between the\nproject, reproducible GitHub Actions build, and signed artifact.\n\nAcceptance is controlled by SignPath Foundation and is not guaranteed. Until\nthe application is approved, releases remain explicitly unsigned.\n\n## Team roles\n\n- Committer and reviewer: [@77degrees](https://github.com/77degrees)\n- Signing approver: [@77degrees](https://github.com/77degrees)\n\nAs the sole maintainer, `77degrees` currently holds all three responsibilities.\nOutside contributions must be reviewed before merge, and every signing request\nrequires manual approval.\n\n## Privacy policy\n\nThis program will not transfer any information to other networked systems\nunless specifically requested by the user or the person installing or\noperating it.\n\nCapture, annotation, OCR, barcode recognition, copy, save, scrolling capture,\nand GIF recording are local. The optional translation command sends only the\nrecognized text to the user-configured HTTPS translation endpoint after the\nuser explicitly requests translation. Screenshot pixels are not sent. See\n[Security and Privacy](security-and-privacy.md) for the full policy.\n\n## Eligibility controls\n\n- The repository is public.\n- SnipArc source is licensed under the OSI-approved MIT License.\n- Third-party components and their licenses are listed in\n  `THIRD_PARTY_NOTICES.md` and `licenses/`.\n- All non-system runtime components use OSI-approved licenses. Animated GIF\n  encoding uses the MIT-licensed WPF imaging stack rather than a custom-license\n  package.\n- The current unsigned alpha was published before signing integration. The\n  repeatable `Unsigned release build` workflow now builds and tests the EXE,\n  MSI, and extension on a GitHub-hosted Windows runner and uploads one immutable\n  signing-input artifact.\n- Release source, workflow, commit, tests, and checksums remain publicly\n  inspectable.\n- No proprietary SnipArc source or separate commercial edition exists.\n\n## Planned SignPath integration\n\nAfter approval, the maintainer will:\n\n1. Install the SignPath GitHub App for this repository.\n2. Configure the SignPath organization, project, signing policy, and artifact\n   configuration issued during onboarding.\n3. Store only the SignPath submission token as a GitHub Actions secret.\n4. Upload the unsigned artifact through GitHub Actions before submitting its\n   GitHub artifact ID to SignPath.\n5. Use origin verification and GitHub-hosted runners.\n6. Deep-sign the first-party application binaries and the outer MSI/Setup EXE\n   while excluding third-party binaries.\n7. Verify Authenticode status and publish SHA-256 checksums before release.\n\nThe exact workflow identifiers cannot be committed before SignPath creates the\nproject and signing policy.\n\nThe unsigned half of this process is already implemented in\n`.github/workflows/release-build.yml`. Its raw ZIP artifact preserves the EXE,\nMSI, extension, and checksums as one immutable GitHub artifact whose\n`artifact-id` can be submitted to SignPath after onboarding.\n\n## Official references\n\n- [SignPath Foundation](https://signpath.org/)\n- [Open-source program conditions](https://signpath.org/terms.html)\n- [SignPath GitHub integration](https://docs.signpath.io/trusted-build-systems/github)\n- [SignPath artifact configuration](https://docs.signpath.io/artifact-configuration/)\n", "security-and-privacy.md": "# Security and Privacy\n\nStatus: Required controls for version 1.0\nLast reviewed: 2026-07-20\n\n## 1. Security objective\n\nScreenshots may contain credentials, customer data, legal material, private conversations, internal systems, or other sensitive information. The application must minimize collection, storage, transmission, and logging of captured content.\n\nThe safest default is local-only operation. Uploading is optional and is a distinct trust boundary.\n\n## 2. Data classification\n\n| Data | Classification | Default persistence |\n|---|---|---|\n| Captured source pixels | Sensitive user content | Memory only |\n| Composited output pixels | Sensitive user content | Memory only until explicit save/upload |\n| Clipboard bitmap | Sensitive user content | Windows clipboard, explicit copy only |\n| Saved image | User-controlled content | User-selected path |\n| Upload payload | Sensitive user content | Remote provider after explicit upload |\n| View URL | Potentially sensitive locator | Clipboard; optional metadata history |\n| Deletion token | Secret | Credential Manager/DPAPI only |\n| Provider credential/API key | Secret | Credential Manager/DPAPI only |\n| Settings | Internal | LocalAppData JSON; no secrets |\n| Diagnostic logs | Internal | LocalAppData; never image content or secrets |\n\n## 3. Privacy promises\n\nVersion 1.0 must be able to state truthfully:\n\n- Capture, editing, clipboard copy, and local saving do not require a network connection.\n- The application does not upload automatically.\n- The application does not collect telemetry by default.\n- Screenshot pixels are not written to temporary files during ordinary capture/edit/copy.\n- Upload occurs only after the user selects Upload.\n- The upload provider and visibility/retention model are shown before first use.\n- Logs do not contain screenshot pixels, recognized text, clipboard content, credentials, or deletion tokens.\n\nAny future telemetry feature requires a new decision record, documented event schema, opt-in/opt-out behavior, retention policy, and privacy review.\n\n## 4. Trust boundaries\n\n```text\n[Desktop pixels]\n      |\n      v\n[Local process memory] ----explicit save----> [User-selected filesystem]\n      |\n      +----explicit copy---------------------> [Windows clipboard]\n      |\n      +----explicit upload-------------------> [HTTPS provider]\n                                                   |\n                                                   v\n                                           [Anyone with view URL]\n```\n\nAdditional boundaries:\n\n- Installer download to local machine.\n- Update metadata and installer retrieval.\n- Single-instance IPC between processes in the same user session.\n- Windows Credential Manager/DPAPI for secrets.\n\n## 5. Threats and required controls\n\n### T-01: Accidental upload\n\nRisk: A sensitive screenshot leaves the computer because upload is automatic or visually confused with Copy/Save.\n\nControls:\n\n- Upload requires an explicit button or dedicated shortcut.\n- No upload on selection completion.\n- First-use warning identifies provider, visibility, and retention.\n- Upload control uses a distinct accessible name and confirmation state.\n- Network tests verify zero requests during capture/edit/copy/save.\n\n### T-02: Guessable public URLs\n\nRisk: A first-party host exposes screenshots through enumerable identifiers.\n\nControls:\n\n- Generate at least 128 bits of cryptographic randomness for object identifiers.\n- Do not use counters, timestamps, short sequential IDs, or reversible user IDs.\n- Apply HTTPS, rate limits, deletion, and optional expiration.\n- Do not claim URLs are private; describe them as accessible to anyone who has the link.\n\n### T-03: Credential or deletion-token disclosure\n\nRisk: Secrets appear in settings, history, logs, exceptions, clipboard, or crash dumps.\n\nControls:\n\n- Store secrets only in Credential Manager or DPAPI-protected records.\n- Store a stable secret reference in settings, not the secret value.\n- Redact headers, query parameters, tokens, and provider response bodies from logs.\n- Never copy a deletion token to the clipboard automatically.\n- Clear secret buffers when practical and never include them in exception messages.\n\n### T-04: HTTPS downgrade or credential forwarding\n\nRisk: A redirect sends screenshot bytes or authorization to HTTP or another origin.\n\nControls:\n\n- Require HTTPS for all non-loopback upload endpoints.\n- Reject HTTPS-to-HTTP redirects.\n- Never forward authorization headers to a different origin.\n- Use default Windows certificate validation with no user bypass.\n- Bound redirects and request timeout.\n\n### T-05: Incomplete redaction\n\nRisk: Pixelation, blur, transparency, layers, metadata, or undo state lets a recipient recover covered content.\n\nControls:\n\n- Label pixelation as visual obfuscation, not secure redaction.\n- Provide a separate fully opaque redaction tool.\n- Replace every covered output pixel in the final compositor.\n- Do not export editor layers or source-image metadata.\n- Decode the final file in tests and assert uniform replacement pixels in redacted bounds.\n\n### T-06: Screenshot residue\n\nRisk: Sensitive pixels remain in temp files, crash artifacts, thumbnails, history, or logs.\n\nControls:\n\n- Keep source and composited images in memory.\n- Save atomically in the selected destination directory, not a global temp folder.\n- Keep local history metadata-only by default.\n- Require explicit opt-in and retention controls before storing thumbnails.\n- Inspect LocalAppData, Temp, recent files, logs, and install directories in release tests.\n\n### T-07: Malicious local IPC\n\nRisk: Another process blocks activation, injects a command, or sends oversized data.\n\nControls:\n\n- Scope mutex/IPC names with current user SID and session.\n- Apply restrictive ACLs.\n- Accept only fixed activation message types and bounded payloads.\n- Never accept paths, URLs, image bytes, provider settings, or shell commands through activation IPC.\n\n### T-08: Malicious or replaced update\n\nRisk: Update notification leads the user to an attacker-controlled installer.\n\nControls before updates are enabled:\n\n- Retrieve signed metadata over HTTPS.\n- Pin the expected Authenticode publisher identity.\n- Enforce channel and monotonic-version rules.\n- Reject downgrade redirects and unexpected origins.\n- Verify the complete installer before prompting execution.\n- Publish and display SHA-256 checksums.\n\n### T-09: Path and filename abuse\n\nRisk: Invalid filename templates or unsafe paths overwrite files or escape the intended destination.\n\nControls:\n\n- Validate templates and reserved Windows names.\n- Resolve and display the final destination before writing when confirmation is required.\n- Use collision suffixes by default.\n- Never silently overwrite.\n- Quote executable paths written to the startup registry value.\n\n### T-10: Recognition or translation disclosure\n\nRisk: Image pixels, extracted text, or confidential barcodes leave the device without clear intent.\n\nControls:\n\n- OCR and barcode recognition use bundled local engines and make no HTTP request.\n- Do not log image pixels, OCR text, barcode values, or translation bodies.\n- Translation is disabled until the user configures an endpoint and presses Translate.\n- Accept HTTPS translation endpoints; allow HTTP only for loopback development.\n- Send extracted text only, never the source image.\n- Send the optional `api_key` field only when the user configures a key; omit it otherwise.\n- Managed environments can disable translation through policy, which clears both the stored\n  endpoint and the stored API key at runtime.\n- The API key is stored in plain text in the per-user settings JSON. It is a service credential\n  for a translation provider, not an account password, and the settings file already carries the\n  user's other preferences. Prefer a self-hosted endpoint that requires no key.\n- Translation failure messages name the cause (missing key, wrong path, rate limit) and may\n  include the service's own error text. They never include the submitted text.\n\n### T-11: Browser-extension capture exposure\n\nRisk: A browser capture is retained, uploaded, or made available to unrelated pages or extensions.\n\nControls:\n\n- Request `activeTab` rather than broad host permissions.\n- Capture only after the user clicks the extension action.\n- Keep the pending PNG in extension session storage.\n- Perform crop, copy, and download in the extension origin without remote scripts or network APIs.\n- Browser-protected pages remain unavailable by platform design.\n\n### T-12: Recording and scrolling-capture residue\n\nRisk: A canceled capture leaves partial files or unbounded image data.\n\nControls:\n\n- Bound animated GIF duration, frame interval, and maximum dimension.\n- Exclude capture-control windows and omit the mouse pointer from repeated frames.\n- Use sibling partial files and atomic rename for completed outputs.\n- Delete partial files on encoder failure and delete completed GIF output when the user cancels.\n- Keep scrolling pages only in memory until Finish; Cancel writes nothing.\n\n## 6. Upload-service requirements\n\nIf a first-party service is built, it is a separate project and deployment boundary. At minimum it must provide:\n\n- HTTPS only.\n- Maximum request and decoded image dimensions.\n- MIME type and actual image decoding validation.\n- Re-encoding or metadata stripping where appropriate.\n- Cryptographically random object IDs.\n- Rate limiting and abuse controls.\n- Configurable expiration.\n- Unauthenticated or authenticated deletion through a secret deletion token.\n- Clear visibility and retention terms.\n- No directory listing, sequential browsing, or search endpoint.\n- Operational logs that exclude image bytes and secrets.\n- Backup/retention behavior consistent with advertised deletion.\n\nUse only documented upload-provider APIs. Do not integrate undocumented or private third-party protocols.\n\n## 7. Logging policy\n\nAllowed fields:\n\n- Application version and build ID.\n- Windows version and architecture.\n- Operation name and duration.\n- Display count, dimensions, DPI values, and coordinate topology.\n- Error category and sanitized stack trace.\n- Provider identifier and HTTP status class, without URL path/query/body.\n- GDI/User handle counts for diagnostics.\n\nForbidden fields:\n\n- Image pixels, encoded images, thumbnails, or hashes intended to fingerprint content.\n- OCR/extracted text or clipboard contents.\n- Local filenames unless the user explicitly creates a support bundle that previews them.\n- Full upload URLs.\n- Authorization headers, cookies, API keys, deletion tokens, or signed query parameters.\n- Usernames, email addresses, or unrelated device identifiers.\n\nTranslation request bodies, barcode values, and recognition confidence details are also forbidden.\n\nLogs should use a bounded rolling policy with a documented retention period and a user-facing delete action.\n\n## 8. Installer and signing controls\n\n- Build unsigned inputs in CI with recorded source revision and dependency lock state.\n- Scan dependencies and release payloads.\n- Sign the application EXE before packaging.\n- Sign and timestamp the final installer.\n- Use one consistent RSA-based publisher identity.\n- Test and publish the exact signed installer hash.\n- Do not claim timestamped signed binaries are bit-for-bit reproducible.\n- Preserve provenance linking source revision, unsigned input hash, signed payload hash, and release tag.\n\nUnsigned internal alpha builds must be labeled clearly and must not be presented as trusted public releases.\n\n## 9. Security verification gate\n\nA public 1.0 release requires evidence that:\n\n- No network connection occurs for local workflows.\n- No screenshot residue appears outside the selected destination/clipboard/provider.\n- Redacted output contains only opaque replacement pixels in covered regions.\n- Secrets are absent from settings, history, logs, exceptions, and support bundles.\n- Redirect and certificate rules are enforced.\n- IPC rejects another user's/session's access and malformed messages.\n- Installer and application signatures validate and match the expected publisher.\n- Dependency and Defender scans have no unresolved release-blocking result.\n\nDetailed procedures are in [Testing strategy](testing.md).\n", "testing.md": "# Testing Strategy\n\n## Latest local alpha verification\n\nVerified on 2026-07-22:\n\n- Release build: zero warnings and zero errors.\n- Automated tests: 90 passed (48 core, 34 Windows infrastructure, 8 app/export/recognition behavior).\n- Self-contained `win-x64` publish, Inno Setup compilation, and WiX 5 MSI compilation succeeded.\n- Extension JavaScript syntax, manifest JSON, and ADMX/ADML XML validation passed.\n- Silent per-user install, tray-process startup, second-instance handoff, capture overlay, and uninstall were exercised locally.\n- The compact overlay and directional resize cursors were visually confirmed in an interactive Windows session.\n\nThis evidence validates the local development machine only. The full display, DPI, graphics, accessibility, upgrade, and clean-VM matrix below remains required for a public stable release.\n\nStatus: Required verification model for version 1.0\nLast reviewed: 2026-07-22\n\n## 1. Test objectives\n\nTesting must prove more than “a screenshot appeared.” Version 1.0 requires evidence that:\n\n- Selection maps to exact physical pixels across supported display layouts.\n- Preview and output use consistent annotation geometry.\n- Secure redaction cannot be undone from the exported file.\n- Local workflows do not use the network or persist hidden image data.\n- Native resources do not leak across repeated captures.\n- Clipboard, tray, overlays, hotkeys, and installer behavior work in an interactive Windows session.\n- The exact signed artifact being published passed the release suite.\n\n## 2. Test layers\n\n| Layer | Environment | Coverage |\n|---|---|---|\n| Core unit | GitHub-hosted Windows runner | Geometry, commands, settings validation, filename rules, upload policy logic |\n| Windows integration | Dedicated interactive Windows VM | Hotkeys, clipboard, tray, overlays, registry, capture, DPI, installer UI |\n| Golden image | CI plus interactive VM | Annotation/compositor pixels, encoders, redaction, color tolerances |\n| Media/recognition | CI plus interactive VM | Scrolling overlap, GIF timing/looping, OCR language data, barcode formats, translation boundary |\n| HTTP integration | Local fake server | Upload success/failure/cancel, redirect, credential and timeout behavior |\n| Installer | Fresh VM/Sandbox snapshots | Clean install, prior-version upgrade, reinstall, interruption recovery, silent switches, uninstall |\n| Manual hardware | Physical/VM display matrix | Mixed DPI, HDR, multiple monitors, portrait, RDP, common paste targets |\n| Security/privacy | Isolated VM with traffic/filesystem inspection | No implicit network, no pixel residue, no secret logging, signature validation |\n| Soak/performance | Reference physical machine | Latency budgets, memory, CPU, GDI/User handles over repeated sessions |\n\nOrdinary GitHub-hosted CI is not considered evidence for interactive desktop behavior. Windows services/session 0 cannot reliably validate clipboard, hotkeys, topmost WPF overlays, tray icons, or monitor DPI interaction.\n\n## 3. Test projects\n\n```text\ntests/\n  AppName.Core.Tests/\n    Geometry/\n    Annotations/\n    Commands/\n    Filenames/\n    Settings/\n  AppName.Windows.Tests/\n    DisplayTopology/\n    Capture/\n    Clipboard/\n    Hotkeys/\n    Registry/\n  AppName.IntegrationTests/\n    Overlay/\n    Upload/\n    Installer/\n    Privacy/\n  GoldenImages/\n    Inputs/\n    Expected/\n    Masks/\n```\n\nKeep production service calls out of every automated test. Upload tests use a local server under test control.\n\n## 4. Core unit tests\n\n### Geometry\n\nCover:\n\n- Drag in all four directions.\n- Zero-size selection rejection.\n- Window-candidate filtering for visibility, minimization, DWM cloaking, tool windows, shell windows, process identity, titles, and empty bounds.\n- Topmost-first hover selection and half-open window hit-testing.\n- Normalization, clamp, move, resize, and handle hit-testing.\n- Negative virtual-desktop origins.\n- Monitor gaps and non-rectangular topologies.\n- 100%, 125%, 150%, 175%, and 200% conversions.\n- Cross-monitor selection clipping.\n- Fullscreen selection on the active monitor.\n- One-pixel keyboard nudge and modified increments.\n\nProperty tests should generate valid display topologies and assert:\n\n- Normalized width/height are nonnegative.\n- A clamped selection does not leave capture bounds.\n- UI-to-physical-to-UI conversions stay within documented rounding tolerance.\n- Output dimensions exactly equal the physical selection dimensions.\n\n### Editor commands\n\nFor every annotation type:\n\n- Create, commit, cancel, undo, and redo.\n- Stable ordering.\n- Color and stroke width behavior.\n- Serialization only if document persistence is later introduced.\n- Selection-lock behavior after the first annotation.\n\nUndo/redo tests compare the complete domain model, not only rendered pixels.\n\n### Settings and filenames\n\n- Default creation and round trip.\n- Each schema migration.\n- Unknown future field handling.\n- Malformed/truncated JSON recovery.\n- Atomic-write interruption.\n- Invalid hotkey and path rejection.\n- Windows + Shift + S override chord matching, key-repeat suppression, key-up handling, and reset behavior.\n- Reserved names, Unicode, long paths, invalid characters, collisions, and clock-equal filenames.\n- Startup registry path quoting.\n\n## 5. Golden-image tests\n\nUse small deterministic source fixtures plus representative 1080p and 4K fixtures.\n\nFor each tool, test:\n\n- Horizontal, vertical, diagonal, and clipped geometry where applicable.\n- Minimum and maximum supported widths.\n- Multiple colors and transparency.\n- Drawing at selection boundaries.\n- Combined layers and ordering.\n- DPI-independent preview geometry versus physical-pixel compositor output.\n\n### Comparison policy\n\n- Geometry and output dimensions: exact.\n- Opaque redaction region: exact replacement color for every decoded pixel.\n- PNG/BMP lossless regions: exact unless a documented color-management conversion applies.\n- WPF text/anti-aliasing and JPEG: use an explicit per-channel/structural tolerance stored with the test, never an unreviewed blanket threshold.\n- A changed golden image requires reviewer approval and a reason in the change description.\n\nThe redaction test decodes the exported file, crops the redacted bounds, and verifies that source pixels, transparency, metadata layers, and alternate frames cannot recover covered content.\n\n## 6. Capture and display tests\n\n### Required display matrix\n\n| Configuration | Required checks |\n|---|---|\n| 1920x1080 at 100% | Complete happy path and baseline performance |\n| 4K at 150% | Selection precision, annotation placement, toolbar layout |\n| 4K at 200% | Text/accessibility scaling, edges, performance |\n| Two displays at 100%/150% | Each display and selection crossing boundary |\n| Secondary left of primary | Negative X coordinates and cursor hotspot |\n| Secondary above primary | Negative Y coordinates and toolbar placement |\n| Landscape plus portrait | Bounds, clipping, annotations |\n| HDR on/off where available | Color comparison and documented capture limits |\n| RDP session | Capture behavior and reconnect stability |\n\nEach recorded result includes:\n\n- Exact Windows build and edition.\n- GPU model and display-driver version.\n- Monitor resolution, orientation, scale, and layout.\n- Application version/commit.\n- Installer SHA-256.\n- Capture backend.\n- Pass/fail, measured latency, and evidence artifact references.\n\n### Capture assertions\n\n- Source snapshot completes before overlay visibility.\n- No overlay pixels appear in output.\n- `SRCCOPY | CAPTUREBLT` behavior is documented for layered windows.\n- Cursor include/exclude, hotspot, and negative coordinates are correct.\n- A display change during capture cancels safely.\n- Repeated hotkey presses create only one session.\n- Secure/DRM/exclusive-fullscreen limitations fail safely and are documented.\n\n## 7. Clipboard compatibility\n\nAutomated checks:\n\n- Correct bitmap dimensions and pixel sample.\n- Bounded retry when another process holds the clipboard.\n- Final failure keeps capture state available.\n- No temporary image file is created.\n\nManual paste targets:\n\n- Microsoft Paint.\n- Outlook.\n- Teams.\n- Word and PowerPoint.\n- Current Edge and Chrome.\n- Slack and Discord desktop clients when available.\n\nRecord target application versions with release evidence.\n\n## 8. File-output tests\n\n- PNG, JPEG, and BMP decode successfully.\n- Dimensions match selection.\n- JPEG quality setting changes expected size/quality.\n- Save As and quick-save use the same compositor.\n- Filename collision creates a suffix.\n- Existing file is never silently overwritten.\n- Destination errors preserve capture state.\n- Unicode, long, OneDrive, unavailable network, read-only, and disk-full cases return actionable errors.\n- Successful output leaves no screenshot in global temp or log locations.\n\n## 9. Upload tests\n\nUse a local fake server to simulate:\n\n- 2xx success with view URL, deletion token, and expiration.\n- Slow response and progress reporting.\n- User cancellation.\n- DNS/connect/TLS/timeout failures.\n- 400, 401/403, 404, 409, 413, 429, and 5xx classes.\n- Malformed JSON and invalid URLs.\n- Same-origin HTTPS redirect.\n- HTTPS-to-HTTP downgrade rejection.\n- Cross-origin redirect without authorization forwarding.\n- Redirect loop and excessive redirect count.\n\nAssertions:\n\n- No request occurs before explicit upload.\n- Credentials and deletion tokens never enter settings, history, logs, exceptions, or clipboard.\n- Failure leaves copy/save/retry available.\n- URL is copied only after provider success.\n- Certificate-validation bypass is impossible in production configuration.\n\nProduction endpoints are never called from CI.\n\n### Scrolling, recording, and recognition\n\nAutomated coverage must
