<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SnipArc Docs</title>
<style>
:root{
  --bg:#f7f8fa; --panel:#fff; --side:#eef1f5; --text:#1a1f2b; --muted:#66707f;
  --line:#dde2ea; --accent:#2f5fd0; --accent-soft:#e6edfb; --code-bg:#f0f2f6;
  --mark:#fde68a;
}
:root[data-theme=dark]{
  --bg:#11151c; --panel:#161b24; --side:#0e1218; --text:#e3e8ef; --muted:#8d97a6;
  --line:#232b37; --accent:#7aa2f7; --accent-soft:#1b2436; --code-bg:#0d1117;
  --mark:#7c5e12;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    --bg:#11151c; --panel:#161b24; --side:#0e1218; --text:#e3e8ef; --muted:#8d97a6;
    --line:#232b37; --accent:#7aa2f7; --accent-soft:#1b2436; --code-bg:#0d1117;
    --mark:#7c5e12;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--text); display:flex; height:100vh; overflow:hidden;
  font:15px/1.65 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
aside{
  width:280px; flex:none; background:var(--side); border-right:1px solid var(--line);
  display:flex; flex-direction:column; overflow:hidden;
}
.brand{padding:18px 18px 12px;border-bottom:1px solid var(--line)}
.brand h1{margin:0;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.brand p{margin:4px 0 0;font-size:18px;font-weight:650}
.tools{padding:12px 14px;display:flex;gap:8px;border-bottom:1px solid var(--line)}
#q{
  flex:1;min-width:0;padding:7px 10px;border:1px solid var(--line);border-radius:7px;
  background:var(--panel);color:var(--text);font-size:13px;
}
#q:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
#theme{
  flex:none;width:34px;border:1px solid var(--line);border-radius:7px;background:var(--panel);
  color:var(--muted);cursor:pointer;font-size:14px;
}
#theme:hover{color:var(--text);border-color:var(--accent)}
nav{overflow-y:auto;padding:10px 0 30px;flex:1}
nav h2{
  margin:16px 18px 6px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);font-weight:700;
}
nav a{
  display:block;padding:6px 18px;color:var(--text);text-decoration:none;font-size:13.5px;
  border-left:2px solid transparent;
}
nav a:hover{background:var(--accent-soft)}
nav a.on{border-left-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
nav a .hit{display:block;font-size:11px;color:var(--muted);font-weight:400}
nav a.hide{display:none}
main{flex:1;overflow-y:auto;padding:44px 52px 120px}
article{max-width:820px;margin:0 auto}
.note{
  max-width:820px;margin:0 auto;padding:20px 22px;border:1px solid var(--line);
  border-radius:10px;background:var(--panel);
}
.note h2{margin:0 0 10px;font-size:17px}
.note code{white-space:pre-wrap}
.note .why{color:var(--muted);font-size:13.5px;margin-bottom:0}
h1,h2,h3,h4,h5,h6{line-height:1.3;margin:1.9em 0 .6em;font-weight:650}
h1{font-size:29px;margin-top:0;letter-spacing:-.01em}
h2{font-size:21px;padding-bottom:6px;border-bottom:1px solid var(--line)}
h3{font-size:17px}
h4,h5,h6{font-size:15px}
p,ul,ol{margin:0 0 1em}
ul,ol{padding-left:1.4em}
li{margin:.25em 0}
a{color:var(--accent)}
hr{border:0;border-top:1px solid var(--line);margin:2em 0}
blockquote{
  margin:1em 0;padding:.6em 1em;border-left:3px solid var(--accent);
  background:var(--accent-soft);border-radius:0 6px 6px 0;color:var(--muted);
}
blockquote p:last-child{margin:0}
code{
  font:13px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;
  background:var(--code-bg);padding:.15em .4em;border-radius:4px;
}
pre{
  background:var(--code-bg);border:1px solid var(--line);border-radius:8px;
  padding:14px 16px;overflow-x:auto;margin:0 0 1.2em;
}
pre code{background:none;padding:0;font-size:12.5px;line-height:1.35}
article img{max-width:100%;height:auto;display:block;margin:0 0 1.4em}
.tw{overflow-x:auto;margin:0 0 1.3em}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{border:1px solid var(--line);padding:7px 11px;text-align:left;vertical-align:top}
th{background:var(--code-bg);font-weight:650}
mark{background:var(--mark);color:inherit;border-radius:2px}
@media (max-width:820px){
  body{flex-direction:column}
  aside{width:100%;height:auto;max-height:44vh;border-right:0;border-bottom:1px solid var(--line)}
  main{padding:26px 20px 80px}
}
</style>
</head>
<body>
<aside>
  <div class="brand"><h1>SnipArc</h1><p>Documentation</p></div>
  <div class="tools">
    <input id="q" type="search" placeholder="Search all docs..." autocomplete="off">
    <button id="theme" title="Toggle theme">◑</button>
  </div>
  <nav id="nav"></nav>
</aside>
<main><article id="view"></article></main>

<script>
// Manifest. Add an entry whenever a doc is added to this folder.
const DOCS = [
  {g:"Overview", f:"../CHANGELOG.md", t:"Changelog"},
  {g:"Overview", f:"README.md", t:"Documentation Index"},
  {g:"Overview", f:"architecture.md", t:"Architecture"},
  {g:"Overview", f:"requirements.md", t:"Product Requirements"},

  {g:"Documents", f:"code-signing.md", t:"Code signing policy"},
  {g:"Documents", f:"security-and-privacy.md", t:"Security and Privacy"},
  {g:"Documents", f:"testing.md", t:"Testing Strategy"},

  {g:"Project", f:"../README.md", t:"Project README"},
  {g:"Project", f:"../CONTRIBUTING.md", t:"Contributing"},
  {g:"Project", f:"../SECURITY.md", t:"Security policy"},
  {g:"Project", f:"../deploy/libretranslate/README.md", t:"Translation backend"},
];

/* ---------- markdown ---------- */
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function inline(s){
  // \ue000 is a private-use sentinel. It cannot occur in real documentation, and
  // unlike a NUL byte it keeps this file plain text as far as git is concerned.
  const code = [];
  s = s.replace(/`([^`]+)`/g, (m,c) => (code.push(c), '\ue000C'+(code.length-1)+'\ue000'));
  s = esc(s);
  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, '<img alt="$1" src="$2" style="max-width:100%">');
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2">$1</a>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  s = s.replace(/~~([^~]+)~~/g, '<del>$1</del>');
  return s.replace(/\ue000C(\d+)\ue000/g, (m,i) => '<code>'+esc(code[i])+'</code>');
}

function render(src){
  const L = src.replace(/\r/g,'').split('\n');
  const out = [];
  let i = 0;
  const blank = s => !s.trim();

  while(i < L.length){
    const line = L[i];

    if(blank(line)){ i++; continue; }

    // fenced code
    const fence = line.match(/^```(\w*)/);
    if(fence){
      const buf = [];
      i++;
      while(i < L.length && !/^```/.test(L[i])) buf.push(L[i++]);
      i++;
      out.push('<pre><code>'+esc(buf.join('\n'))+'</code></pre>');
      continue;
    }

    // heading
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if(h){ const n = h[1].length; out.push(`<h${n}>${inline(h[2])}</h${n}>`); i++; continue; }

    // hr
    if(/^\s*(---+|\*\*\*+|___+)\s*$/.test(line)){ out.push('<hr>'); i++; continue; }

    // table: header row followed by a separator row
    if(/^\s*\|/.test(line) && i+1 < L.length && /^\s*\|[\s:|-]+\|?\s*$/.test(L[i+1])){
      const cells = r => r.trim().replace(/^\||\|$/g,'').split('|').map(c => c.trim());
      const head = cells(line);
      i += 2;
      const rows = [];
      while(i < L.length && /^\s*\|/.test(L[i])) rows.push(cells(L[i++]));
      out.push(
        '<div class="tw"><table><thead><tr>' +
        head.map(c => '<th>'+inline(c)+'</th>').join('') +
        '</tr></thead><tbody>' +
        rows.map(r => '<tr>'+r.map(c => '<td>'+inline(c)+'</td>').join('')+'</tr>').join('') +
        '</tbody></table></div>'
      );
      continue;
    }

    // blockquote
    if(/^\s*>/.test(line)){
      const buf = [];
      while(i < L.length && /^\s*>/.test(L[i])) buf.push(L[i++].replace(/^\s*>\s?/,''));
      out.push('<blockquote>'+render(buf.join('\n'))+'</blockquote>');
      continue;
    }

    // list, two levels via indentation
    if(/^\s*([-*+]|\d+\.)\s+/.test(line)){
      const tag = /^\s*\d+\./.test(line) ? 'ol' : 'ul';
      let html = '<'+tag+'>';
      let depth = 0, openItem = false;
      while(i < L.length && /^\s*([-*+]|\d+\.)\s+/.test(L[i])){
        const m = L[i].match(/^(\s*)([-*+]|\d+\.)\s+(.*)$/);
        const d = m[1].length >= 2 ? 1 : 0;
        if(d > depth){                      // descend, parent <li> stays open
          html += '<ul>'; depth = d; openItem = false;
        }else if(d < depth){                // close nested list AND its parent <li>
          if(openItem) html += '</li>';
          html += '</ul></li>'; depth = d; openItem = false;
        }else if(openItem){ html += '</li>'; openItem = false; }
        html += '<li>' + inline(m[3]);
        openItem = true;
        i++;
        // continuation lines belonging to this item
        while(i < L.length && !blank(L[i]) && !/^\s*([-*+]|\d+\.)\s+/.test(L[i]) && !/^[#>`|]/.test(L[i])){
          html += ' ' + inline(L[i].trim());
          i++;
        }
      }
      if(depth > 0){                        // still nested at end of list
        if(openItem) html += '</li>';
        html += '</ul></li>'; openItem = false;
      }
      if(openItem) html += '</li>';
      out.push(html + '</'+tag+'>');
      continue;
    }

    // paragraph
    const buf = [];
    while(i < L.length && !blank(L[i]) && !/^\s*([-*+]|\d+\.)\s+/.test(L[i])
          && !/^(#{1,6}\s|```|\s*>|\s*\|)/.test(L[i]) && !/^\s*(---+|\*\*\*+)\s*$/.test(L[i])){
      buf.push(L[i++]);
    }
    if(buf.length) out.push('<p>'+inline(buf.join('\n'))+'</p>');
  }
  return out.join('\n');
}

/* ---------- app ---------- */
const nav = document.getElementById('nav');
const view = document.getElementById('view');
const q = document.getElementById('q');
const cache = {};
let links = [];

function buildNav(){
  let group = null;
  DOCS.forEach(d => {
    if(d.g !== group){
      group = d.g;
      const h = document.createElement('h2');
      h.textContent = group;
      nav.appendChild(h);
    }
    const a = document.createElement('a');
    a.href = '#' + d.f;
    a.textContent = d.t;
    a.dataset.file = d.f;
    nav.appendChild(a);
    links.push(a);
  });
}

async function load(file){
  if(cache[file] !== undefined) return cache[file];
  const r = await fetch(file);
  if(!r.ok) throw new Error(r.status + ' ' + r.statusText);
  return cache[file] = await r.text();
}

async function show(file){
  const doc = DOCS.find(d => d.f === file) || DOCS[0];
  links.forEach(a => a.classList.toggle('on', a.dataset.file === doc.f));
  try{
    view.innerHTML = render(await load(doc.f));
    if(q.value.trim()) highlight(q.value.trim());
    document.querySelector('main').scrollTop = 0;
  }catch(e){
    view.innerHTML = `<div class="note"><h2>Could not load ${esc(doc.f)}</h2><p>${esc(e.message)}</p></div>`;
  }
}

function highlight(term){
  const re = new RegExp('('+term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
  const walk = document.createTreeWalker(view, NodeFilter.SHOW_TEXT);
  const hits = [];
  let n;
  while(n = walk.nextNode()) if(re.test(n.nodeValue)) hits.push(n);
  hits.forEach(t => {
    const span = document.createElement('span');
    span.innerHTML = esc(t.nodeValue).replace(re, '<mark>$1</mark>');
    t.parentNode.replaceChild(span, t);
  });
}

async function search(term){
  const t = term.trim().toLowerCase();
  if(!t){
    links.forEach(a => { a.classList.remove('hide'); const s = a.querySelector('.hit'); if(s) s.remove(); });
    return;
  }
  await Promise.all(DOCS.map(d => load(d.f).catch(() => '')));
  links.forEach(a => {
    const body = (cache[a.dataset.file] || '').toLowerCase();
    const n = body.split(t).length - 1;
    const titleHit = a.dataset.file.toLowerCase().includes(t) || a.textContent.toLowerCase().includes(t);
    a.classList.toggle('hide', n === 0 && !titleHit);
    let s = a.querySelector('.hit');
    if(n > 0){
      if(!s){ s = document.createElement('span'); s.className = 'hit'; a.appendChild(s); }
      s.textContent = n + (n === 1 ? ' match' : ' matches');
    }else if(s) s.remove();
  });
}

function fileProtocolNotice(){
  view.innerHTML = `<div class="note">
    <h2>Double-click <code>serve.cmd</code> instead</h2>
    <p>It sits next to this file, in the same <code>docs</code> folder. It starts a small local
    server and reopens this page working, on a free port it picks itself.</p>
    <p class="why">Why the extra step: this page reads the <code>.md</code> files at load time, so
    it can never show you a stale copy of a doc. Browsers block reading local files from
    <code>file://</code>, so that only works over HTTP. The markdown is plain text and readable in
    any editor meanwhile.</p>
  </div>`;
}

// theme
const theme = document.getElementById('theme');
const saved = localStorage.getItem('docs-theme');
if(saved) document.documentElement.dataset.theme = saved;
theme.onclick = () => {
  const dark = matchMedia('(prefers-color-scheme:dark)').matches;
  const now = document.documentElement.dataset.theme || (dark ? 'dark' : 'light');
  const next = now === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem('docs-theme', next);
};

let searchTimer;
q.oninput = () => { clearTimeout(searchTimer); searchTimer = setTimeout(() => search(q.value), 120); };
addEventListener('hashchange', () => show(decodeURIComponent(location.hash.slice(1))));
addEventListener('keydown', e => {
  if(e.key === '/' && document.activeElement !== q){ e.preventDefault(); q.focus(); }
  if(e.key === 'Escape' && document.activeElement === q){ q.value = ''; search(''); q.blur(); }
});

buildNav();
if(location.protocol === 'file:') fileProtocolNotice();
else show(decodeURIComponent(location.hash.slice(1)) || DOCS[0].f);
</script>
</body>
</html>
